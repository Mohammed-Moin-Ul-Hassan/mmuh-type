<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Cloud Ray Tech Solutions — Typing Practice</title>
    <meta charset="UTF-8">
    <meta name="application-name" content="Cloud Ray Tech Solutions">
    <meta name="author" content="MMUH">
    <meta name="description" content="Typing practice for Cloud Ray Tech Solutions advisors.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #0b1020;
        --panel: #f5f7fb;
        --ink: #182233;
        --muted: #54657c;
        --line: #dfe7f2;
        --accent: #2867ff;
        --accent-strong: #1747c7;
        --success: #1ca25a;
        --warning: #d98d00;
        --error: #d63a3a;
        --shadow: 0 18px 46px rgba(12, 18, 33, 0.18);
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #0b1020 0%, #0f1730 100%);
        color: var(--ink);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body { line-height: 1.5; }

      a:link, a:visited { color: #1e52d9; }
      a:hover { color: #163db0; }

      header {
        color: #edf3ff;
        background: rgba(10, 17, 30, 0.72);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(8px);
      }

      .brand-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .brand {
        font-weight: 800;
        letter-spacing: 0.02em;
        font-size: clamp(1.25rem, 1.8vw, 2rem);
      }

      .brand small {
        display: block;
        font-size: 0.68rem;
        opacity: 0.75;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .chip-btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18);
        color: inherit;
        border-radius: 999px;
        padding: 0.45rem 0.95rem;
        font-size: 0.8rem;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s ease;
      }

      .chip-btn:hover { background: rgba(255,255,255,0.14); }
      .chip-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      #warningBanner {
        display: none;
        background: #fff3f3;
        border: 2px solid var(--error);
        color: #7a1616;
        border-radius: 14px;
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
        font-weight: 600;
      }
      #warningBanner code { background: #ffe0e0; padding: 0.1rem 0.35rem; border-radius: 4px; }

      .panel {
        background: rgba(255,255,255,0.94);
        border: 1px solid rgba(15,23,42,0.08);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .toolbar {
        background: linear-gradient(180deg, #ffffff, #f2f5fb);
        border-bottom: 1px solid var(--line);
        padding: 1rem 1.25rem;
      }

      .unit-title {
        font-weight: 700;
        font-size: 1.05rem;
        margin-bottom: 0.85rem;
        color: var(--ink);
      }

      /* ITEM 6: units horizontal — 4 in one row on desktop */
      #unitLinks {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 0.5rem;
      }
      #unitLinks div {
        flex: 1 1 0;
        min-width: 0;
        background: #edf2ff;
        border: 1px solid #cfe0ff;
        border-radius: 12px;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.6rem;
        font-size: 0.85rem;
        text-align: center;
        overflow: hidden;
        transition: 0.2s ease;
      }
      #unitLinks div.selected {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      #unitLinks div a { text-decoration: none; color: var(--ink); font-weight: 600; }
      #unitLinks div.selected a { color: #fff; }

      #sectionLinks {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      #sectionLinks div {
        flex: 1 1 160px;
        background: #edf2ff;
        border: 1px solid #cfe0ff;
        border-radius: 12px;
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.4rem 0.6rem;
        font-size: 0.85rem;
      }
      #sectionLinks div.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
      #sectionLinks a { text-decoration: none; color: var(--ink); font-weight: 600; }
      #sectionLinks div.selected a { color: #fff; }

      #practiceArea { padding: clamp(1rem, 2vw, 1.75rem); }

      /* ITEM 8: Monkeytype-style — borderless, centered, mono, caret */
      #practicePane {
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(248,250,252,0.96);
        padding: 1.5rem 1rem;
        position: relative;
      }

      #target {
        min-height: 220px;
        max-height: 360px;
        overflow-y: auto;
        margin: 0 0 1rem;
        background: transparent;
        border: none;
        padding: 0.5rem 0.25rem;
        font-family: var(--mono);
        font-size: clamp(1.15rem, 1.8vw, 1.75rem);
        line-height: 1.85;
        letter-spacing: 0.01em;
        white-space: pre-wrap;
        word-break: break-word;
        color: #5b6b82;
        cursor: text;
      }

      #target .char { position: relative; }
      #target .char.correct { color: var(--success); }
      #target .char.incorrect {
        color: var(--error);
        background: rgba(214,58,58,0.12);
        border-radius: 3px;
      }
      #target .char.current {
        color: var(--ink);
      }
      #target .char.current::before {
        content: '';
        position: absolute;
        left: -1px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--accent);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* ITEM 8: hide the native input — we drive it programmatically */
      #input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
        left: -9999px;
      }

      #feedback {
        display: grid;
        grid-template-columns: 1fr 1.5fr 1fr;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1rem;
      }

      #report, #score { display: flex; flex-direction: column; gap: 0.25rem; }
      #score { text-align: right; }

      #status {
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent-strong);
      }
      .ready #status { color: var(--success); }
      .error #status { color: var(--error); }
      .retake #status { color: var(--warning); }
      .success #status { color: var(--success); }

      #progress { display: flex; flex-direction: column; gap: 0.45rem; }
      progress { width: 100%; height: 12px; border-radius: 999px; }

      #controlRow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      #advice, #restart {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.95rem;
      }
      #advice {
        text-decoration: none;
        background: linear-gradient(135deg, #eef4ff, #edf7ff);
        color: var(--ink);
        visibility: hidden;
      }
      #restart { background: #fff; color: var(--ink); visibility: hidden; }

      #guidePane {
        padding: 1rem 1.25rem 1.5rem;
        border-top: 1px solid var(--line);
      }
      #guideLink {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      #guideText {
        margin-top: 0.95rem;
        padding: 1rem 1.1rem;
        border-radius: 14px;
        background: linear-gradient(180deg, #f7f9ff, #eef4ff);
        border: 1px solid var(--line);
        color: var(--muted);
      }

      /* ITEM 3b: announcements */
      #announcements {
        margin-top: 1.5rem;
        background: rgba(255,255,255,0.94);
        border: 1px solid rgba(15,23,42,0.08);
        border-radius: 20px;
        padding: 1.25rem 1.5rem;
        box-shadow: var(--shadow);
      }
      #announcements h3 {
        margin: 0 0 0.85rem;
        font-size: 1.05rem;
        color: var(--ink);
      }
      #announcementList { display: flex; flex-direction: column; gap: 0.6rem; }
      .announce-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        background: linear-gradient(135deg, #eef4ff, #f6faff);
        border: 1px solid #d6e3ff;
        text-decoration: none;
        color: var(--ink);
        font-weight: 600;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .announce-item:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(40,103,255,0.18);
      }
      .announce-item .arrow { color: var(--accent); font-weight: 800; }

      footer {
        color: #eaf1ff;
        background: rgba(10, 17, 30, 0.42);
        border-top: 1px solid rgba(255,255,255,0.08);
        margin-top: 2rem;
      }
      .footer-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.2rem 1.5rem 1.6rem;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      footer nav { display: flex; flex-wrap: wrap; gap: 1rem; }
      footer a { color: #dfeaff; text-decoration: none; }
      footer p { margin: 0; color: rgba(223,234,255,0.88); }

      @media (max-width: 720px) {
        .brand-wrap, .footer-wrap { flex-direction: column; align-items: flex-start; }
        #feedback { grid-template-columns: 1fr; }
        #score { text-align: left; }
        main { padding: 1rem; }
        #unitLinks { flex-wrap: wrap; }
        #unitLinks div { flex: 1 1 45%; }
      }
    </style>

    <script src="phrases.js"></script>
    <script src="announcements.js"></script>
  </head>
  <body>
    <header>
      <div class="brand-wrap">
        <div class="brand">
          Cloud Ray Tech Solutions
          <small>Typing Practice</small>
        </div>
        <div class="top-actions" style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button class="chip-btn" id="drillBtn" type="button">Passage drills</button>
          <button class="chip-btn" id="accuracyBtn" type="button">Accuracy first</button>
        </div>
      </div>
    </header>

    <main>
      <div id="warningBanner" role="alert"></div>

      <div class="panel">
        <div class="toolbar">
          <div id="unitTitle" class="unit-title"></div>
          <div id="unitLinks"></div>
          <div id="sectionLinks"></div>
        </div>

        <div id="practiceArea">
          <div id="practicePane" class="ready">
            <div id="target" aria-live="polite" tabindex="0"></div>

            <div id="feedback">
              <div id="report">
                <span id="status">READY</span>
                <span id="remark"></span>
              </div>
              <div id="progress">
                <progress id="progressBar" max="100" value="0"></progress>
                <span id="progressPercent">0%</span>
              </div>
              <div id="score">
                <span id="speed">0 wpm</span>
                <span id="error">0%</span>
                <span id="icon">(◡‿◡)</span>
              </div>
            </div>

            <input id="input" type="text" autocomplete="off" spellcheck="false" aria-label="Practice input" />

            <div id="controlRow">
              <a id="advice" href="#">Try again</a>
              <button id="restart" type="button">Restart</button>
            </div>
          </div>
        </div>

        <div id="guidePane">
          <a id="guideLink" href="#">Guide</a>
          <div id="guideText" style="display:none"></div>
        </div>
      </div>

      <section id="announcements">
        <h3>Earning Opportunities &amp; Announcements</h3>
        <div id="announcementList"></div>
      </section>
    </main>

    <footer>
      <div class="footer-wrap">
        <nav>
          <a href="#">Home</a>
          <a href="#">Lessons</a>
          <a href="#">Progress</a>
        </nav>
        <p>Made with &hearts; by MMUH</p>
      </div>
    </footer>

    <noscript>
      <p style="color:#fff; padding:1rem;">JavaScript is required for Cloud Ray Tech Solutions typing practice.</p>
    </noscript>

    <script>
      /* ---------------- State ---------------- */
      let UNITS = null;
      let unitLinks, sectionLinks, unitTitle, guideLink, guideText;
      let practiceArea, practicePane, target, input;
      let status, remark, advice, progressBar, progressPercent, restart, speed, errorEl, icon;
      let warningBanner;

      let state, targetText, targetChars, cursor, errors, startTime, keystrokes;
      let mode = 'flow'; // 'flow' | 'accuracy'

      const BEGIN_STATE = 'BEGIN_STATE';
      const RUNNING_STATE = 'RUNNING_STATE';
      const ERROR_STATE = 'ERROR_STATE';
      const RETAKE_STATE = 'RETAKE_STATE';
      const SUCCESS_STATE = 'SUCCESS_STATE';

      const JOY_ICON = '(\uff61\u0298\u203f\u0298\uff61)';
      const HAPPY_ICON = '(\u0298\u203f\u0298)';
      const UNHAPPY_ICON = '(\u2299_\u2299)';
      const SAD_ICON = '(\u2299\u2054\u2299)';

      function safeStorageGet (key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
      function safeStorageSet (key, value) { try { window.localStorage.setItem(key, value); } catch (e) {} }

      /* ---------------- Boot & Validation (ITEM 4) ---------------- */
      function boot () {
        warningBanner = document.getElementById('warningBanner');
        const problems = [];

        if (!window.MMUH_PHRASES || !Array.isArray(window.MMUH_PHRASES.main) || window.MMUH_PHRASES.main.length === 0) {
          problems.push('phrases.js is missing or <code>MMUH_PHRASES.main</code> is empty. Check that phrases.js is loaded and the array has at least one unit.');
        } else {
          window.MMUH_PHRASES.main.forEach((u, i) => {
            if (!u.title) problems.push('Unit ' + (i+1) + ': missing <code>title</code>.');
            if (!u.sections || Object.keys(u.sections).length === 0) problems.push('Unit ' + (i+1) + ': missing <code>sections</code>.');
            else Object.keys(u.sections).forEach(k => {
              if (typeof u.sections[k] !== 'string' || u.sections[k].trim() === '') {
                problems.push('Unit ' + (i+1) + ', section <code>' + k + '</code>: must be a non-empty string.');
              }
            });
          });
        }

        if (problems.length > 0) {
          warningBanner.style.display = 'block';
          warningBanner.innerHTML = '<strong>Content warning — the typing tutor cannot start cleanly:</strong><br>' + problems.join('<br>') +
            '<br><br><em>Fix phrases.js and refresh. The page is still running; it just has no content to show.</em>';
          return;
        }

        UNITS = window.MMUH_PHRASES;
        init();
        renderAnnouncements();
      }

      function renderAnnouncements () {
        const list = document.getElementById('announcementList');
        if (!list) return;
        list.replaceChildren();
        const items = Array.isArray(window.MMUH_ANNOUNCEMENTS) ? window.MMUH_ANNOUNCEMENTS : [];
        if (items.length === 0) {
          const empty = document.createElement('p');
          empty.style.color = '#54657c';
          empty.style.margin = '0';
          empty.textContent = 'No announcements right now. Check back later.';
          list.append(empty);
          return;
        }
        items.forEach(item => {
          const a = document.createElement('a');
          a.className = 'announce-item';
          a.href = item.url || '#';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          const t = document.createElement('span');
          t.textContent = item.title || 'Untitled opportunity';
          const arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.textContent = '\u2192';
          a.append(t, arrow);
          list.append(a);
        });
      }

      /* ---------------- Init ---------------- */
      function init () {
        unitLinks = document.getElementById('unitLinks');
        sectionLinks = document.getElementById('sectionLinks');
        unitTitle = document.getElementById('unitTitle');
        guideLink = document.getElementById('guideLink');
        guideText = document.getElementById('guideText');
        practiceArea = document.getElementById('practiceArea');
        practicePane = document.getElementById('practicePane');
        target = document.getElementById('target');
        input = document.getElementById('input');
        status = document.getElementById('status');
        remark = document.getElementById('remark');
        advice = document.getElementById('advice');
        progressBar = document.getElementById('progressBar');
        progressPercent = document.getElementById('progressPercent');
        restart = document.getElementById('restart');
        speed = document.getElementById('speed');
        errorEl = document.getElementById('error');
        icon = document.getElementById('icon');

        if (window.location.hash === '' && safeStorageGet('unit') !== null && safeStorageGet('unit') !== '#1') {
          window.location.hash = safeStorageGet('unit');
        }

        // ITEM 3a: real buttons
        document.getElementById('drillBtn').addEventListener('click', () => setMode('flow'));
        document.getElementById('accuracyBtn').addEventListener('click', () => setMode('accuracy'));
        setMode('flow', true);

        setupLesson();

        // ITEM 5: listen on the hidden input; never block advance
        input.addEventListener('input', onInput);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') return; // allow tab nav
          if (e.key === 'Backspace') { /* handled by browser */ }
        });
        target.addEventListener('click', () => input.focus());

        guideLink.addEventListener('click', toggleGuide);
        restart.addEventListener('click', restartLesson);
        advice.addEventListener('click', handleAdviceClick);
        window.addEventListener('hashchange', setupLesson);
      }

      function setMode (m, silent) {
        mode = m;
        document.getElementById('drillBtn').classList.toggle('active', m === 'flow');
        document.getElementById('accuracyBtn').classList.toggle('active', m === 'accuracy');
        if (!silent) {
          setupLesson();
        }
      }

      function setupLesson () {
        const [unit, section] = getLesson();
        if (unit > UNITS.main.length || section > Object.keys(pickUnit(unit).sections).length) {
          window.location.hash = '';
          return;
        }

        state = BEGIN_STATE;
        errors = 0;
        cursor = 0;
        keystrokes = 0;
        startTime = 0;
        input.value = '';

        showUnitTitle(unit, section);
        showUnitLinks(unit);
        showSectionLinks(unit, section);
        targetText = getTargetText(unit, section);
        targetChars = targetText.split('');
        guideText.innerHTML = pickUnit(unit).guide;
        hideGuide();
        renderTarget();
        applyState();
        updateMetrics(0, 0);
        input.focus();
        safeStorageSet('unit', sectionHref(unit, section));
      }

      function restartLesson (e) { if (e) e.preventDefault(); setupLesson(); }

      function handleAdviceClick (e) {
        e.preventDefault();
        const action = advice.dataset.action;
        if (action === 'restart') { setupLesson(); return; }
        if (action === 'next') {
          const href = advice.getAttribute('href');
          if (href && href !== '#') { window.location.hash = href; }
        }
      }

      function getLesson () {
        let unit = 1, section = 1;
        if (window.location.hash.length > 0) {
          const tokens = window.location.hash.slice(1).split('.');
          unit = parseInt(tokens[0], 10);
          if (tokens.length > 1) section = parseInt(tokens[1], 10);
        }
        if (Number.isNaN(unit)) unit = 1;
        if (Number.isNaN(section)) section = 1;
        return [unit, section];
      }

      function pickUnit (unit) { return UNITS.main[unit - 1]; }

      function showUnitTitle (unit, section) {
        unitTitle.textContent = `Unit ${unit}.${section} [${pickUnit(unit).title}]`;
      }

      function showUnitLinks (unit) {
        unitLinks.replaceChildren();
        for (let i = 1; i <= UNITS.main.length; i++) {
          const div = boxedLink('Unit ' + i, '#' + i, i === unit);
          div.title = pickUnit(i).title;
          unitLinks.append(div);
        }
      }

      function showSectionLinks (unit, section) {
        const sections = pickUnit(unit).sections;
        const titles = Object.keys(sections);
        sectionLinks.replaceChildren();
        for (let i = 1; i <= titles.length; i++) {
          const div = boxedLink(titles[i - 1], '#' + unit + '.' + i, i === section);
          sectionLinks.append(div);
        }
      }

      function getTargetText (unit, section) {
        const sections = pickUnit(unit).sections;
        const texts = Object.values(sections);
        return texts[section - 1].replaceAll('  ', ' ');
      }

      function boxedLink (text, href, selected) {
        const div = document.createElement('div');
        if (selected) {
          div.textContent = text;
          div.className = 'selected';
        } else {
          const anchor = document.createElement('a');
          anchor.textContent = text;
          anchor.href = href;
          div.append(anchor);
        }
        return div;
      }

      /* ---------------- ITEM 7 + 8: full passage, caret, per-char coloring ---------------- */
      function renderTarget () {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < targetChars.length; i++) {
          const span = document.createElement('span');
          span.className = 'char';
          span.textContent = targetChars[i];
          frag.append(span);
        }
        target.replaceChildren(frag);
        highlightCursor();
      }

      function highlightCursor () {
        const spans = target.querySelectorAll('.char');
        spans.forEach((s, i) => {
          s.classList.remove('current', 'correct', 'incorrect');
          if (i < cursor) {
            s.classList.add(input.value[i] === targetChars[i] ? 'correct' : 'incorrect');
          }
        });
        if (cursor < spans.length) {
          spans[cursor].classList.add('current');
          spans[cursor].scrollIntoView({ block: 'nearest' });
        }
      }

      /* ---------------- ITEM 5: flow mode — never block, always count ---------------- */
      function onInput () {
        if (state === BEGIN_STATE && input.value.length > 0) {
          startTime = new Date().getTime();
          state = RUNNING_STATE;
          applyState();
        }

        const typed = input.value;
        keystrokes = typed.length;

        // count mismatches in the typed prefix vs target
        let newCursor = 0;
        let newErrors = 0;
        const max = Math.min(typed.length, targetChars.length);
        for (let i = 0; i < max; i++) {
          if (typed[i] === targetChars[i]) newCursor = i + 1;
          else newErrors++;
        }
        // in flow mode cursor moves to end of typed text (or target end)
        if (mode === 'flow') {
          newCursor = Math.min(typed.length, targetChars.length);
